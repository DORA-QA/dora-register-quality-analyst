[project]
name = "dora-qa-backend"
version = "1.0.0"
description = "Quality assurance engine for DORA Registers of Information - backend API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Data layer, prepared for the next sprints (not used in Sprint 0).
    "polars>=1.12",
    "lxml>=6.1.3",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",
    "ruff>=0.7",
    "pyyaml>=6.0.3",
    "mypy>=1.13",
    "lxml-stubs>=0.5",
    "pdfplumber>=0.11",
]

[tool.uv]
# The backend is an application, not a distributable library.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "contracts",
    "dataset",
    "import_engine",
    "rules",
    "scoring",
    "reports",
]

# mypy, Sprint 4 (decision A8 of the PO, 02/11/2026): two levels.
# Step 1, blocking in the CI: shared contracts and the modules of the Sprint 4, strict.
# Steps 2 and 3 (rules, import, API): report only, see ``mypy-report`` in the CI.
[tool.mypy]
python_version = "3.13"
files = ["contracts", "scoring", "indicators", "reports", "gleif"]
strict = true
warn_unused_ignores = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
# The only module allowed to name ``Any`` (JSON files and table rows).
[[tool.mypy.overrides]]
module = ["contracts.json_types"]
disallow_any_explicit = false

# Third-party libraries without type information are declared one by one, never globally
# (none today: duckdb, never imported, was removed by CL-45).
