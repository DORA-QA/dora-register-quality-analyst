# Dependabot: weekly version updates, grouped to limit pull requests and CI minutes.
# Security alerts and security updates are enabled in Settings > Code security.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(backend)"
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(frontend)"
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (compiler rewritten in Go) is not supported yet by typescript-eslint
      # (peer typescript < 6.1 in 8.73.0): npm ci fails. Lift this rule once it is.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # The stack is fixed on Python 3.13 and Node 22: a change of version is a project decision.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        patterns: ["*"]
