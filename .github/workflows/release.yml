name: Release

# Portable ZIPs of DORA QA, offline and online versions, for Windows and macOS (Apple Silicon),
# plus the "sources" variant (offline) for workstations that block unsigned programs.
# - pull request touching the build: Windows only, to check that it still builds and starts;
# - manual run: every ZIP, downloadable from the run page (Artifacts) for 14 days;
#   each ZIP is uploaded as is (archive: false): one download, one ZIP to extract;
# - tag vX.Y.Z: every ZIP, SHA-256 sums and SBOM published as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "portable/**"
      - "backend/api/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/package-lock.json"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    name: ZIP ${{ matrix.edition }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["windows-latest"]') || fromJSON('["windows-latest", "macos-latest"]') }}
        edition: [offline, online]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv python install 3.13
      - run: uv sync --frozen --no-dev --project backend
      - run: uv run --project backend --with pyinstaller python portable/build.py ${{ matrix.edition == 'online' && '--online' || '' }}
      - name: Smoke test (launch, health, version, import)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zip"
          unzip -q dist-portable/DORA-QA-*.zip -d "$RUNNER_TEMP/zip"
          exe="$RUNNER_TEMP/zip/DORA-QA/DORA-QA"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          DORA_QA_NO_BROWSER=1 "$exe" > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8765/health > /dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8765/health
          gleif=$(curl -s http://127.0.0.1:8765/api/gleif/status | python -c "import json,sys; print(json.load(sys.stdin)['state'])")
          if [ "${{ matrix.edition }}" = offline ]; then
            test "$gleif" = DISABLED
          else
            # The update runs first: wait until it is over (no register accepted meanwhile).
            for i in $(seq 1 300); do
              [ "$gleif" != UPDATING ] && break
              sleep 2
              gleif=$(curl -s http://127.0.0.1:8765/api/gleif/status | python -c "import json,sys; print(json.load(sys.stdin)['state'])")
            done
            test "$gleif" != DISABLED && test "$gleif" != UPDATING
          fi
          status=$(curl -s -H "X-ROI-Client: ci" -F "file=@sample-data/package-with-defects.sample.zip" \
            http://127.0.0.1:8765/api/import | python -c "import json,sys; print(json.load(sys.stdin)['status'])")
          test "$status" = "FAILED"
          curl -sf http://127.0.0.1:8765/ | grep -q "<title>DORA QA</title>"
      - name: Name of the ZIP (uploaded as is, without a second ZIP around it)
        id: zip
        shell: bash
        run: echo "path=$(ls dist-portable/DORA-QA-*.zip | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          retention-days: 14

  sources:
    # Variant for workstations that block unsigned programs: sources + offline wheels,
    # run from VS Code with the official Python 3.13. Smoke-tested like a user would.
    name: ZIP sources windows (VS Code)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv run --project backend --python 3.13 --with pip python portable/build_sources.py
      - name: Smoke test (offline install, launch, health, import)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist-portable/DORA-QA-sources-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $env:RUNNER_TEMP/dora
          Set-Location $env:RUNNER_TEMP/dora/DORA-QA-sources
          py -3.13 -m venv .venv
          .venv\Scripts\python.exe -m pip install --no-index --find-links wheels -r requirements.txt --disable-pip-version-check
          $env:DORA_QA_NO_BROWSER = "1"
          $p = Start-Process .venv\Scripts\python.exe -ArgumentList portable/launcher.py -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8765/health | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw "health check failed" }
          $r = curl.exe -s -H "X-ROI-Client: ci" -F "file=@exemples/package-with-defects.sample.zip" http://127.0.0.1:8765/api/import | ConvertFrom-Json
          if ($r.status -ne "FAILED") { throw "unexpected status $($r.status)" }
          Stop-Process $p.Id
      - name: Name of the ZIP (uploaded as is, without a second ZIP around it)
        id: zip
        shell: bash
        run: echo "path=$(ls dist-portable/DORA-QA-sources-*.zip | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          retention-days: 14

  publish:
    # Runs on every build (pull requests included) to check the files a release would carry;
    # the GitHub release itself is only created for a tag vX.Y.Z.
    name: Release files
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (needs.sources.result == 'success' || (needs.sources.result == 'skipped' && !startsWith(github.ref, 'refs/tags/v'))) }}
    needs: [build, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the application version, release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          app=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend/api/config.py)
          if [ "$tag" != "$app" ]; then
            echo "::error::Tag v$tag does not match APP_VERSION $app (backend/api/config.py)"; exit 1
          fi
          sed -n "/<!-- release:$tag -->/,/<!-- \/release:$tag -->/p" CHANGELOG.md | sed '1d;$d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No section <!-- release:$tag --> in CHANGELOG.md"; exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
          # Keep each ZIP as uploaded: it is the file the release carries.
          skip-decompress: true
      - name: Each file is a ZIP that opens directly on the DORA-QA folder (no ZIP inside a ZIP)
        working-directory: release
        run: |
          set -euo pipefail
          ls -l
          count=0
          for f in *; do
            case "$f" in DORA-QA-*.zip) ;; *) echo "::error::Unexpected file $f"; exit 1 ;; esac
            top=$(unzip -Z1 "$f" | cut -d/ -f1 | sort -u)
            case "$top" in DORA-QA|DORA-QA-sources) ;; *) echo "::error::$f does not open on the DORA-QA folder: $top"; exit 1 ;; esac
            count=$((count + 1))
          done
          test "$count" -gt 0
      - name: SBOM (SPDX) of the sources and their locked dependencies
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release/dora-qa-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'check' }}.spdx.json
          upload-artifact: false
      - name: SHA-256 sums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          name: DORA QA ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: release/*
