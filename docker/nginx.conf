# Serves the built React application on port 3000 and relays the API on port 8000.
#
# The backend sits on an internal Docker network with no route to the internet;
# this container is the only door to it. Both ports are published on 127.0.0.1 only.

# The page may only call this machine. Nothing is loaded from, or sent to, another host.
# (style-src 'unsafe-inline': Material UI injects its styles at runtime.)
map $host $roi_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
}

# Only the names of this machine are served (review S5, PO decision of 30/10): a request whose
# Host header names another domain (DNS rebinding) gets no answer at all (444 closes it).
server {
    listen 3000 default_server;
    server_name _;
    return 444;
}

server {
    listen 8000 default_server;
    server_name _;
    return 444;
}

server {
    listen 3000;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy $roi_csp always;
    add_header Referrer-Policy "no-referrer" always;

    # Single-page application: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in asset file names, so they can be cached for long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $roi_csp always;
    }
}

server {
    listen 8000;
    server_name localhost 127.0.0.1;

    # Import files go up to 100 MB (plus multipart overhead).
    client_max_body_size 110m;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
